<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3399"/>
      <stop offset="100%" stop-color="#e20074"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#e20074" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- GPS Navigation Arrow & Fiber Wave -->
  <g transform="translate(256, 256)">
    <!-- Pulse rings (fiber waves) -->
    <circle r="140" fill="none" stroke="#e20074" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="12 12"/>
    <circle r="95" fill="none" stroke="#ff3399" stroke-width="6" stroke-opacity="0.4"/>
    
    <!-- Navigation Pointer / Compass Arrow -->
    <path d="M 0 -130 L 85 90 L 0 50 L -85 90 Z" fill="url(#magentaGrad)" filter="url(#glow)"/>
    <path d="M 0 -130 L 0 50 L -85 90 Z" fill="#c40064"/>
    
    <!-- Central fiber core node -->
    <circle cx="0" cy="-20" r="14" fill="#ffffff"/>
  </g>
</svg>
